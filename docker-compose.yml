
services:
  postgres:
    image: postgres:17
    container_name: trino-lab-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: trino-lab-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  nessie:
    image: ghcr.io/projectnessie/nessie:0.109.0
    container_name: trino-lab-nessie
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC2
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_POSTGRESQL_ACTIVE: "true"
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "19120:19120"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  trino:
    image: trinodb/trino:484
    container_name: trino-lab-trino
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/node.properties:/etc/trino/node.properties:ro
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      nessie:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
